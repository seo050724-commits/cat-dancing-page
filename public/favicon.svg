<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="주황색 고양이">
  <!-- tail -->
  <path d="M150 170 C190 160 195 110 170 95" fill="none" stroke="#f39c4a" stroke-width="14" stroke-linecap="round"/>
  <path d="M170 95 C165 92 160 96 162 102" fill="none" stroke="#d97a2b" stroke-width="14" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="100" cy="160" rx="55" ry="48" fill="#f39c4a"/>
  <ellipse cx="100" cy="170" rx="32" ry="32" fill="#fde3c4"/>
  <!-- feet -->
  <ellipse cx="72" cy="205" rx="16" ry="10" fill="#f39c4a"/>
  <ellipse cx="128" cy="205" rx="16" ry="10" fill="#f39c4a"/>
  <!-- ears -->
  <path d="M48 60 L58 10 L92 42 Z" fill="#f39c4a"/>
  <path d="M152 60 L142 10 L108 42 Z" fill="#f39c4a"/>
  <path d="M58 52 L62 24 L82 43 Z" fill="#ffb3c6"/>
  <path d="M142 52 L138 24 L118 43 Z" fill="#ffb3c6"/>
  <!-- head -->
  <ellipse cx="100" cy="78" rx="58" ry="50" fill="#f39c4a"/>
  <!-- stripes -->
  <path d="M100 30 L100 48 M86 33 L90 48 M114 33 L110 48" stroke="#d97a2b" stroke-width="5" stroke-linecap="round"/>
  <!-- muzzle -->
  <ellipse cx="100" cy="96" rx="26" ry="18" fill="#fde3c4"/>
  <!-- eyes -->
  <ellipse cx="76" cy="74" rx="9" ry="11" fill="#2d2233"/>
  <ellipse cx="124" cy="74" rx="9" ry="11" fill="#2d2233"/>
  <circle cx="79" cy="70" r="3.2" fill="#fff"/>
  <circle cx="127" cy="70" r="3.2" fill="#fff"/>
  <!-- blush -->
  <ellipse cx="60" cy="94" rx="9" ry="5" fill="#ff8fab" opacity="0.6"/>
  <ellipse cx="140" cy="94" rx="9" ry="5" fill="#ff8fab" opacity="0.6"/>
  <!-- nose & mouth -->
  <path d="M94 88 L106 88 L100 95 Z" fill="#e0446c"/>
  <path d="M100 95 Q100 104 91 104 M100 95 Q100 104 109 104" fill="none" stroke="#2d2233" stroke-width="2.5" stroke-linecap="round"/>
  <!-- whiskers -->
  <g stroke="#2d2233" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M70 96 L38 90 M70 101 L38 104"/>
    <path d="M130 96 L162 90 M130 101 L162 104"/>
  </g>
  <!-- paws (raised) -->
  <ellipse cx="50" cy="135" rx="14" ry="12" fill="#fde3c4" stroke="#f39c4a" stroke-width="4"/>
  <ellipse cx="150" cy="135" rx="14" ry="12" fill="#fde3c4" stroke="#f39c4a" stroke-width="4"/>
</svg>
